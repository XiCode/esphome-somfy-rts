# Copy to secrets.yaml (or add to the secrets.yaml of the ESPHome Builder)
wifi_ssid: "YOUR_WIFI"
wifi_password: "YOUR_WIFI_PASSWORD"
somfy_api_key: "32 bytes base64, e.g. from https://esphome.io/components/api.html"
somfy_ota_password: "anything"
somfy_ap_password: "at least 8 characters"
# Only for auto-discovery of RF devices (rf433 mqtt_discovery)
mqtt_broker: "IP of your MQTT broker, e.g. Home Assistant"
mqtt_username: "MQTT user"
mqtt_password: "MQTT password"
